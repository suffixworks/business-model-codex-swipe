<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Codex Swipe Reel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#b9361f}
.stage{position:absolute;left:0;top:0;width:540px;height:960px;transform:scale(2);transform-origin:0 0;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#e65a3f 0%,#dd492f 45%,#b9361f 100%);font-family:Anuphan,sans-serif;color:#fff;position:relative}
.cap{position:absolute;left:0;right:0;top:46px;text-align:center;padding:0 30px;transition:opacity .35s,transform .35s}
.cap.out{opacity:0;transform:translateY(-8px)}
.cap .k{font-size:15px;font-weight:600;letter-spacing:.14em;opacity:.85;margin-bottom:8px}
.cap .t{font-size:33px;font-weight:600;line-height:1.3}
.phone{position:absolute;left:50%;top:178px;width:351px;height:740px;margin-left:-175.5px;border-radius:54px;background:#111;
  box-shadow:0 0 0 2px #2b2b2b inset,0 30px 60px rgba(60,10,0,.45),0 0 0 6px rgba(0,0,0,.08)}
.screen{position:absolute;left:11px;top:11px;width:375px;height:812px;transform:scale(.877);transform-origin:0 0;border-radius:52px;overflow:hidden;background:#1c100b}
.status{position:absolute;left:0;right:0;top:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font:600 15px -apple-system,system-ui,sans-serif;color:#fff7f1;z-index:2}
.island{position:absolute;top:9px;left:50%;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:3}
.bat{width:24px;height:11px;border:1.5px solid #fff7f1;border-radius:3px;position:relative}.bat::after{content:"";position:absolute;inset:1.5px;right:4px;background:#fff7f1;border-radius:1px}
iframe{position:absolute;left:0;top:44px;width:375px;height:768px;border:0}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff7f1;opacity:.85;z-index:3}
.finger{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9);
  box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:20;opacity:0;transition:opacity .2s,transform .12s;pointer-events:none}
.finger.on{opacity:1}.finger.down{transform:scale(.8);background:rgba(255,255,255,.75)}
.end{position:absolute;inset:0;background:#dd492f;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center;padding:0 40px;opacity:0;transition:opacity .6s;z-index:30;pointer-events:none}
.end.on{opacity:1}
.end img{width:440px}
.end .by{font-size:18px;font-weight:600;letter-spacing:.2em;opacity:.9;margin-top:-8px}
.end .q{font-size:30px;font-weight:600;line-height:1.35;margin-top:30px}
.end .cta{margin-top:16px;font-size:20px;font-weight:600;background:#fff7f1;color:#dd492f;border-radius:999px;padding:12px 26px}
</style>
</head>
<body>
<div class="stage">
<div class="cap" id="cap"><div class="k" id="capK"></div><div class="t" id="capT"></div></div>
<div class="phone"><div class="screen" id="screen">
  <div class="status"><span>9:41</span><span class="bat"></span></div><div class="island"></div>
  <iframe id="app" src="app/index.html#ep-12" allow="autoplay; encrypted-media"></iframe>
  <div class="home"></div>
</div></div>
<div class="end" id="end">
  <img src="app/img/wordmark.svg" alt="">
  <div class="by">by SUFFIX</div>
  <div class="q">ปัดหาคำถามที่ใช่<br>แล้วฟังคำตอบจากบริษัทจริง</div>
  <div class="cta">ลองเล่นได้ที่ลิงก์ใน Bio</div>
</div>
</div>
<div class="finger" id="finger"></div>
<script>
const $ = id => document.getElementById(id);
window.reel = {
  caption(k, t){ const c = $("cap"); c.classList.add("out"); setTimeout(() => { $("capK").textContent = k; $("capT").innerHTML = t; c.classList.remove("out"); }, 350); },
  finger(x, y, on = true, down = false){ const f = $("finger"); f.style.left = x + "px"; f.style.top = y + "px"; f.classList.toggle("on", on); f.classList.toggle("down", down); },
  // iframe (app) coordinates -> page coordinates
  map(x, y){ const r = $("screen").getBoundingClientRect(), s = r.width / 375; return [r.left + x * s, r.top + (44 + y) * s]; },
  end(){ $("end").classList.add("on"); $("cap").classList.add("out"); },
};
</script>
</body>
</html>
