<title>Business Model Codex Swipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Wordmark bar / stacked question cards in the artwork's orange (drag to fling, Tinder-style) / three action buttons. Bottom sheet for episode detail and the saved list */
:root{
  --ink:#1c100b; --ink2:#2a1912; --paper:#fff7f1; --muted:rgba(255,247,241,.72); --line:rgba(255,247,241,.24);
  --brand:#dd492f; --brand-deep:#b9361f; --spotify:#1ed760;
  --body:"Anuphan","Noto Sans Thai","Sukhumvit Set",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.app{flex:1;min-height:0;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{height:20px;width:auto;max-width:62%}
.sbtn{font:500 13px var(--body);color:var(--paper);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.sbtn b{color:var(--brand);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;border-radius:22px;background:var(--brand);padding:22px 22px 20px;display:flex;flex-direction:column;
  box-shadow:0 16px 36px rgba(0,0,0,.4);touch-action:none;will-change:transform;cursor:grab;overflow:hidden}
.card.dragging{cursor:grabbing}
.card .ep{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--paper);opacity:.85}
.card .q{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;padding-block:12px}
.card .q{gap:14px}
.card .q p{margin:0;font-weight:500;font-size:clamp(19px,5.4vw,25px);line-height:1.45}
.card .q p span{display:block}
.card .foot{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.card .foot small{font-size:12px;color:var(--muted)}
.card .foot b{font-weight:600;font-size:14px}
.stamp{position:absolute;top:56px;padding:4px 12px;border:3px solid;border-radius:10px;font:600 22px var(--body);opacity:0;z-index:2;pointer-events:none}
.stamp.yes{left:20px;color:var(--paper);border-color:var(--paper);transform:rotate(-12deg)}
.stamp.no{right:20px;color:var(--ink);border-color:var(--ink);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:22px}
.act{width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .12s;text-decoration:none}
.act:active{transform:scale(.92)}
.act svg{width:24px;height:24px}
.act.skip{background:var(--ink2);border:1px solid var(--line)} .act.skip svg{stroke:var(--paper);stroke-width:2.4;fill:none;stroke-linecap:round}
.act.play{background:var(--spotify);width:72px;height:72px} .act.play svg{fill:#0b0b0b;margin-left:3px;width:26px;height:26px}
.act.save{background:var(--paper)} .act.save svg{fill:var(--brand)}
.act:focus-visible,.sbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.legend{text-align:center;font-size:12px;color:var(--muted);margin-top:-6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translate(-50%,-10px);background:var(--paper);color:var(--ink);
  font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--ink2);border-radius:22px 22px 0 0;max-height:86%;overflow-y:auto;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));user-select:text;-webkit-user-select:text}
.sheet.on{transform:none}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--brand)}
.sq{margin:0;font-size:17px;line-height:1.6;font-weight:500}
.sq span{display:block}
.sq span+span{margin-top:8px}
.ep-box{border-left:3px solid var(--brand);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.ep-box p{margin:0;font-size:15px;line-height:1.6}
.ep-box b{font-size:13px;font-weight:600;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 16px;font:600 14px var(--body);cursor:pointer;text-decoration:none}
.btn.sp{background:var(--spotify);color:#0b0b0b}
.btn.ghost{background:none;color:var(--paper);border:1px solid var(--line)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list .n{font-size:12px;font-weight:600;color:var(--brand);min-width:44px;padding-top:2px;font-variant-numeric:tabular-nums}
.list .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list .t span{font-size:14px;line-height:1.5}
.list .t small{font-size:12px;color:var(--muted)}
.list a{color:var(--spotify);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;padding-top:2px}
.list button{background:none;border:0;color:var(--muted);font:500 12px var(--body);cursor:pointer;padding:2px 0 0}
.empty{color:var(--muted);font-size:14px;margin:0}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>

., Ltd."}, {"n": 59, "id": "7rIVnoJAqBuwWva8emEtDr", "q": [["ในอุตสาหกรรมของคุณ", "มีตลาดไหน", "ที่ความต้องการมีอยู่แล้ว"], ["แต่ยังไม่มีใคร", "สร้างโครงสร้างพื้นฐาน", "ที่ทำให้คนเข้าถึง", "และขยายได้จริง"]], "hook": "ธุรกิจที่ชนะไม่ใช่เพราะดีกว่าคู่แข่ง แต่เพราะไม่มีคู่แข่งในหมวดที่ตัวเองสร้าง", "co": "CAVA Group, Inc."}, {"n": 60, "id": "2lYYLCMbzFppMbYWSDotS9", "q": [["ในอุตสาหกรรมของคุณ", "มีธุรกิจรายเล็ก", "ที่กระจัดกระจายอยู่ไหม"], ["ถ้ามี ใครจะเป็นคน", "ออกแบบเครือข่าย", "ที่รวมพลังแต่ยังให้อิสระ"], ["และเครือข่ายนี้", "จะชิงส่วนแบ่งตลาด", "ได้หรือไม่"]], "hook": "เครือข่ายโบรกเกอร์ประกันที่สมาชิกไม่ใช่พนักงาน แต่แข่งกับยักษ์ระดับโลกได้", "co": "Steadfast Group Ltd"}, {"n": 61, "id": "51q2ZqE7dn0JNJPGyfqq8m", "q": [["ธุรกิจของคุณ", "มีลูกค้ากลุ่มไหน", "ที่คนในวงการประเมินว่าเสี่ยง", "เพราะไม่ผ่านเกณฑ์มาตรฐาน"], ["ทั้งที่จริงพวกเขา", "อาจมีความมั่นคงซ่อนอยู่"]], "hook": "ธุรกิจจำนำทองที่ใช้ความผูกพันทางวัฒนธรรมแทนเครดิตสกอร์ เข้าถึงลูกค้าที่ธนาคารเอื้อมไม่ถึง", "co": "Muthoot Finance Limited"}, {"n": 62, "id": "2mcodSgKPTtWlEiIUqrgrT", "q": [["ในธุรกิจของคุณ", "กำลังขายแค่ตัวสินค้า", "หรือขายตัวตนให้ลูกค้า"], ["และถ้ายังขายแค่สินค้า", "แบรนด์ของคุณ", "ยืนอยู่บนความเชื่ออะไร", "ที่ทำให้ลูกค้ากลุ่มหนึ่ง", "ยอมจ่ายแพงกว่า"]], "hook": "ไข่กล่องละ 250 บาท ที่คนซื้อซ้ำ โดยไม่รู้สึกว่าแพง", "co": "Vital Farms, Inc."}, {"n": 63, "id": "03eLrfBcERuv0ywepPjptl", "q": [["ลูกค้าเชื่อใจคุณ", "ในเรื่องอะไรเป็นพิเศษ?"], ["ไม่ใช่ว่าคุณขายอะไร", "แต่แบรนด์ของคุณ", "“เป็นตัวแทนของอะไร”"]], "hook": "บริษัทยาสมุนไพรจีน 100 ปี ที่ต่อยอดจากผงห้ามเลือดในสนามรบ กลายเป็นยาสีฟันอันดับหนึ่งของประเทศ", "co": "Yunnan Baiyao Group"}];
const SHOW="https://open.spotify.com/show/72769c7eiWc88azlyoMtLQ";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const url=e=>"https://open.spotify.com/episode/"+e.id;
const deck=$("deck");
let pile=[],saved=[];
try{saved=JSON.parse(localStorage.getItem("bmc-saved")||"[]").filter(n=>EP.some(e=>e.n===n))}catch(_){saved=[]}
const persist=()=>{try{localStorage.setItem("bmc-saved",JSON.stringify(saved))}catch(_){}};

function shuffle(){const a=EP.slice().sort(()=>Math.random()-.5);
  const m=/^#ep-(\d+)$/.exec(location.hash);if(m&&!pile.length&&!deck.children.length){const i=a.findIndex(e=>e.n===+m[1]);if(i>0)a.unshift(a.splice(i,1)[0])}return a}
function makeCard(e){const el=document.createElement("article");el.className="card";el._ep=e;
  el.innerHTML=`<div class="stamp yes">เก็บไว้ฟัง</div><div class="stamp no">ข้าม</div>
   <div class="ep">EP.${e.n}</div>
   <div class="q">${e.q.map(p=>`<p>${p.map(l=>`<span>${esc(l)}</span>`).join("")}</p>`).join("")}</div>
   <div class="foot"><small>${esc(e.hook)}</small><b>${esc(e.co)}</b></div>`;return el}
const live=()=>[...deck.querySelectorAll(".card:not(.gone)")];
const topCard=()=>live().pop();
function layout(){const cs=live();cs.forEach((c,i)=>{const k=cs.length-1-i;c.style.zIndex=10-k;if(!c._drag){
    c.style.transition="transform .28s cubic-bezier(.2,.8,.2,1), filter .28s";c.style.transform=`translateY(${k*12}px) scale(${1-k*.045})`;c.style.filter=k?`brightness(${1-k*.15})`:"none"}});
  const t=topCard();if(t){bind(t);$("bPlay").href=url(t._ep);try{history.replaceState(null,"","#ep-"+t._ep.n)}catch(_){}}}
function fill(){while(live().length<3){if(!pile.length)pile=shuffle();deck.prepend(makeCard(pile.shift()))}layout()}

function bind(c){if(c._bound)return;c._bound=true;let sx=0,sy=0,dx=0,dy=0,t0=0,id=null;
  c.addEventListener("pointerdown",e=>{id=e.pointerId;c.setPointerCapture(id);sx=e.clientX;sy=e.clientY;dx=dy=0;t0=Date.now();c._drag=true;c.classList.add("dragging");c.style.transition="none"});
  c.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;dx=e.clientX-sx;dy=e.clientY-sy;
    c.style.transform=`translate(${dx}px,${dy*.4}px) rotate(${dx/18}deg)`;
    c.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,dx/90));c.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=e=>{if(e.pointerId!==id)return;id=null;c._drag=false;c.classList.remove("dragging");
    const v=Math.abs(dx)/Math.max(1,Date.now()-t0);
    if(Math.abs(dx)<6&&Math.abs(dy)<6){layout();openEp(c._ep);return}
    if(Math.abs(dx)>110||v>.6)fling(c,dx>0?1:-1,dy);else{c.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);layout()}};
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end)}

function fling(c,dir,dy=0){if(!c||c.classList.contains("gone"))return;c.classList.add("gone");
  c.querySelector(dir>0?".yes":".no").style.opacity=1;
  c.style.transition="transform .38s ease-out, opacity .38s";c.style.transform=`translate(${dir*innerWidth*1.2}px,${dy*.4+40}px) rotate(${dir*28}deg)`;c.style.opacity=0;
  setTimeout(()=>c.remove(),400);if(dir>0)save(c._ep);fill()}

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1600)}
function save(e){if(!saved.includes(e.n)){saved.unshift(e.n);persist()}toast("เก็บ EP."+e.n+" ไว้ฟังแล้ว");renderCount()}
function renderCount(){$("savedN").textContent=saved.length}

function openSheet(html){$("sheetBody").innerHTML='<div class="grab"></div>'+html;$("sheet").classList.add("on");$("scrim").classList.add("on");$("sheet").scrollTop=0}
function closeSheet(){$("sheet").classList.remove("on");$("scrim").classList.remove("on")}
function openEp(e){const isSaved=saved.includes(e.n);
  openSheet(`<div class="lbl">EP.${e.n}</div>
   <p class="sq">${e.q.map(p=>`<span>${p.map(esc).join(" ")}</span>`).join("")}</p>
   <div class="ep-box"><p>${esc(e.hook)}</p><b>${esc(e.co)}</b></div>
   <div class="btns"><a class="btn sp" href="${url(e)}" target="_blank" rel="noopener">▶ ฟังบน Spotify</a>
   <button class="btn ghost" data-save="${e.n}" ${isSaved?"disabled":""}>${isSaved?"เก็บไว้แล้ว":"เก็บไว้ฟัง"}</button></div>`)}
function openSaved(){const items=saved.map(n=>EP.find(e=>e.n===n)).filter(Boolean);
  openSheet(`<div class="lbl">เก็บไว้ฟัง · ${items.length} ตอน</div>`+(items.length?`<ul class="list">${items.map(e=>`<li><span class="n">EP.${e.n}</span>
    <span class="t"><span>${esc(e.q[0].join(" "))}</span><small>${esc(e.co)}</small><button data-rm="${e.n}">เอาออก</button></span>
    <a href="${url(e)}" target="_blank" rel="noopener">ฟัง ▶</a></li>`).join("")}</ul>`
    :`<p class="empty">ยังไม่มีตอนที่เก็บไว้ ปัดการ์ดไปทางขวาเพื่อเก็บคำถามที่อยากฟังคำตอบ</p>`)+
    `<div class="btns"><a class="btn ghost" href="${SHOW}" target="_blank" rel="noopener">ดูทุกตอนบน Spotify</a></div>`)}
$("sheetBody").addEventListener("click",ev=>{const s=ev.target.closest("[data-save]"),r=ev.target.closest("[data-rm]");
  if(s){const e=EP.find(x=>x.n===+s.dataset.save);save(e);s.textContent="เก็บไว้แล้ว";s.disabled=true}
  if(r){saved=saved.filter(n=>n!==+r.dataset.rm);persist();renderCount();openSaved()}});
$("savedBtn").onclick=openSaved;$("scrim").onclick=closeSheet;
$("bSkip").onclick=()=>fling(topCard(),-1);$("bSave").onclick=()=>fling(topCard(),1);
addEventListener("keydown",e=>{if($("sheet").classList.contains("on")){if(e.key==="Escape")closeSheet();return}
  if(e.key==="ArrowRight")fling(topCard(),1);if(e.key==="ArrowLeft")fling(topCard(),-1);if(e.key==="ArrowUp"&&topCard())openEp(topCard()._ep)});
let sy0=null;$("sheet").addEventListener("touchstart",e=>{if($("sheet").scrollTop<=0)sy0=e.touches[0].clientY},{passive:true});
$("sheet").addEventListener("touchend",e=>{if(sy0!==null&&e.changedTouches[0].clientY-sy0>70)closeSheet();sy0=null});
renderCount();fill();
</script>
